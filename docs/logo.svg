<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgD1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="boltGradD1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="boltShadeD1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <mask id="cutoutD1">
      <rect width="512" height="512" fill="#FFFFFF" />
      <polygon points="276,96 182,256 254,256 236,416 330,244 258,244" fill="#000000" stroke="#000000" stroke-width="26" stroke-linejoin="round" stroke-linecap="round" />
    </mask>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgD1)" />

  <!-- Masked Server Blades -->
  <g mask="url(#cutoutD1)">
    <!-- Blade 1 -->
    <rect x="96" y="136" width="320" height="60" rx="18" fill="#FFFFFF" />
    <rect x="122" y="161" width="88" height="10" rx="5" fill="#DBEAFE" />
    <circle cx="366" cy="166" r="7" fill="#38BDF8" />
    <circle cx="390" cy="166" r="7" fill="#10B981" />

    <!-- Blade 2 -->
    <rect x="96" y="226" width="320" height="60" rx="18" fill="#FFFFFF" />
    <rect x="122" y="251" width="88" height="10" rx="5" fill="#DBEAFE" />
    <circle cx="366" cy="256" r="7" fill="#38BDF8" />
    <circle cx="390" cy="256" r="7" fill="#10B981" />

    <!-- Blade 3 -->
    <rect x="96" y="316" width="320" height="60" rx="18" fill="#FFFFFF" />
    <rect x="122" y="341" width="88" height="10" rx="5" fill="#DBEAFE" />
    <circle cx="342" cy="346" r="7" fill="#38BDF8" />
    <circle cx="366" cy="346" r="7" fill="#38BDF8" />
    <circle cx="390" cy="346" r="7" fill="#10B981" />
  </g>

  <!-- Dynamic Faceted Lightning Bolt -->
  <polygon points="276,96 182,256 254,256 236,416 262,250" fill="url(#boltGradD1)" />
  <polygon points="276,96 262,250 236,416 330,244 258,244" fill="url(#boltShadeD1)" />
</svg>